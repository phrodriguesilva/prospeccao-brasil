{{define "hero_form_error.html"}}
<div id="hero-form-container">
{{if .Errors.Generic}}<div class="alert alert-error mb-4 text-sm">{{.Errors.Generic}}</div>{{end}}
<form hx-post="/fale-conosco" hx-target="#hero-form-container" hx-swap="outerHTML" action="/fale-conosco" method="POST" class="space-y-4">
<input type="hidden" name="subject" value="Solicitação de diagnóstico de expansão (Home)">
<input type="text" name="company" maxlength="255" placeholder="Empresa" value="{{.Form.Company}}" class="mk-input">
<input type="text" name="name" required minlength="2" maxlength="255" placeholder="Nome *" value="{{.Form.Name}}" class="mk-input">
{{if .Errors.Name}}<p class="form-error text-xs">{{.Errors.Name}}</p>{{end}}
<input type="email" name="email" required placeholder="E-mail *" value="{{.Form.Email}}" class="mk-input">
{{if .Errors.Email}}<p class="form-error text-xs">{{.Errors.Email}}</p>{{end}}
<input type="tel" name="phone" placeholder="Telefone" value="{{.Form.Phone}}" class="mk-input">
<button type="submit" class="mk-btn mk-btn--gold w-full">Solicitar contato</button>
</form>
</div>
{{end}}
