{{define "contact_error.html"}}
<div id="contact-form-container" class="mk-form-card" style="padding:34px;">
{{if .Errors.Generic}}<div class="alert alert-error mb-5">{{.Errors.Generic}}</div>{{end}}
<form hx-post="/fale-conosco" hx-target="#contact-form-container" hx-swap="outerHTML" action="/fale-conosco" method="POST" class="space-y-5">
<div>
<label for="company">Empresa (opcional)</label>
<input type="text" id="company" name="company" maxlength="255" class="mk-input" value="{{.Form.Company}}" placeholder="Nome da empresa">
</div>
<div>
<label for="name">Nome *</label>
<input type="text" id="name" name="name" required minlength="2" maxlength="255" class="mk-input" value="{{.Form.Name}}">
{{if .Errors.Name}}<p class="form-error">{{.Errors.Name}}</p>{{end}}
</div>
<div>
<label for="email">E-mail *</label>
<input type="email" id="email" name="email" required class="mk-input" value="{{.Form.Email}}">
{{if .Errors.Email}}<p class="form-error">{{.Errors.Email}}</p>{{end}}
</div>
<div>
<label for="phone">Telefone (opcional)</label>
<input type="tel" id="phone" name="phone" placeholder="+55 21 99999-9999" class="mk-input" value="{{.Form.Phone}}">
</div>
<div>
<label for="subject">Assunto *</label>
<input type="text" id="subject" name="subject" required minlength="2" maxlength="255" class="mk-input" value="{{.Form.Subject}}">
{{if .Errors.Subject}}<p class="form-error">{{.Errors.Subject}}</p>{{end}}
</div>
<div>
<label for="message">Mensagem *</label>
<textarea id="message" name="message" required minlength="10" maxlength="5000" rows="4" class="mk-input">{{.Form.Message}}</textarea>
{{if .Errors.Message}}<p class="form-error">{{.Errors.Message}}</p>{{end}}
</div>
<button type="submit" class="mk-btn mk-btn--gold w-full">Solicitar contato</button>
</form>
</div>
{{end}}
