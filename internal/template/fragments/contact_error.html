{{define "contact_error.html"}}
<div id="contact-form-container">
{{if .Errors.Generic}}<div class="bg-error-container border border-error rounded-lg p-4 mb-6">
<p class="text-error">{{.Errors.Generic}}</p>
</div>{{end}}
<form hx-post="/fale-conosco" hx-target="#contact-form-container" hx-swap="outerHTML" action="/fale-conosco" method="POST" class="space-y-6">
<div>
<label for="name" class="form-label">Nome *</label>
<input type="text" id="name" name="name" required minlength="2" maxlength="255" class="form-input {{if .Errors.Name}}form-input-error{{end}}" value="{{.Form.Name}}">
{{if .Errors.Name}}<p class="form-error">{{.Errors.Name}}</p>{{end}}
</div>
<div>
<label for="email" class="form-label">Email *</label>
<input type="email" id="email" name="email" required class="form-input {{if .Errors.Email}}form-input-error{{end}}" value="{{.Form.Email}}">
{{if .Errors.Email}}<p class="form-error">{{.Errors.Email}}</p>{{end}}
</div>
<div>
<label for="phone" class="form-label">Telefone (opcional)</label>
<input type="tel" id="phone" name="phone" placeholder="+55 11 99999-9999" class="form-input" value="{{.Form.Phone}}">
</div>
<div>
<label for="subject" class="form-label">Assunto *</label>
<input type="text" id="subject" name="subject" required minlength="2" maxlength="255" class="form-input {{if .Errors.Subject}}form-input-error{{end}}" value="{{.Form.Subject}}">
{{if .Errors.Subject}}<p class="form-error">{{.Errors.Subject}}</p>{{end}}
</div>
<div>
<label for="message" class="form-label">Mensagem *</label>
<textarea id="message" name="message" required minlength="10" maxlength="5000" rows="5" class="form-input {{if .Errors.Message}}form-input-error{{end}}">{{.Form.Message}}</textarea>
{{if .Errors.Message}}<p class="form-error">{{.Errors.Message}}</p>{{end}}
</div>
<button type="submit" class="btn btn-primary btn-lg w-full">Enviar Mensagem</button>
</form>
</div>
{{end}}
