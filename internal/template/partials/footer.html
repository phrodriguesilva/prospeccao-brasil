{{define "footer"}}<footer class="bg-primary text-on-primary mt-section-gap">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
<div class="grid grid-cols-1 md:grid-cols-3 gap-8">
<div>
<h3 class="font-display text-headline-md mb-4">Prospecção Brasil</h3>
<p class="text-body-md text-primary-on-container">Inteligência em prospecção de imóveis comerciais.</p>
</div>
<div>
<h4 class="font-semibold text-body-lg mb-4">Contato</h4>
<ul class="space-y-2 text-body-md text-primary-on-container">
<li><a href="/fale-conosco" class="hover:text-on-primary">Fale Conosco</a></li>
<li><a href="mailto:contato@prospeccao.com.br" class="hover:text-on-primary">contato@prospeccao.com.br</a></li>
</ul>
</div>
<div>
<h4 class="font-semibold text-body-lg mb-4">Newsletter</h4>
<p class="text-body-md text-primary-on-container mb-3">Receba novos imóveis comerciais em primeira mão.</p>
<form hx-post="/newsletter" hx-target="#newsletter-result" hx-swap="innerHTML" action="/newsletter" method="POST" id="newsletter-form">
<div class="flex gap-2">
<input type="email" name="email" placeholder="Seu email" required class="form-input flex-1 text-on-surface">
<button type="submit" class="btn btn-secondary btn-sm">Inscrever</button>
</div>
</form>
<div id="newsletter-result"></div>
</div>
</div>
<div class="border-t border-primary-container mt-8 pt-8 text-center text-body-md text-primary-on-container">
<p>&copy; 2026 Prospecção Brasil. Todos os direitos reservados.</p>
</div>
</div>
</footer>{{end}}
