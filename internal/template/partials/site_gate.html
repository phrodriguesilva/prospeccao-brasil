{{define "site_gate"}}
<div x-data="{ unlocked: localStorage.getItem('site_gate') === 'prospeccao', password: '', error: false, submit() { if (this.password === 'prospeccao') { localStorage.setItem('site_gate', 'prospeccao'); this.unlocked = true; } else { this.error = true; } } }" x-show="!unlocked" x-cloak class="fixed inset-0 z-[200] flex items-center justify-center bg-surface" style="display: none;">
<div class="diag-lines"></div>
<div class="dot-matrix"></div>
<div class="relative w-full max-w-sm mx-4 z-10">
<div class="text-center mb-8">
<img src="/static/img/logo-symbol.png" alt="Prospecção Brasil" class="mx-auto mb-4 nav-logo-symbol" width="96" height="78">
<h1 class="font-display text-2xl text-white font-bold uppercase tracking-tight">Prospecção Brasil</h1>
<p class="text-sm text-gold-brand mt-2 uppercase tracking-wider">Área Restrita</p>
</div>
<div class="form-glass rounded-2xl p-6">
<p class="text-sm text-on-surface-variant mb-4 text-center">Este site é exclusivo para clientes e parceiros autorizados. Informe a senha para acessar.</p>
<form @submit.prevent="submit()" class="space-y-4">
<div>
<input type="password" x-model="password" placeholder="Senha" @input="error = false" class="form-input text-center" autocomplete="off" :class="{ 'form-input-error': error }">
<p x-show="error" x-cloak class="form-error text-center mt-2" style="display: none;">Senha incorreta. Tente novamente.</p>
</div>
<button type="submit" class="btn btn-filled w-full">Acessar</button>
</form>
</div>
<p class="text-center text-xs text-on-surface-variant/60 mt-6">Prospecção Brasil -- Retail & Real Estate</p>
</div>
</div>
{{end}}
