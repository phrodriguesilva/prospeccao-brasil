{{define "site_gate"}}
<div x-data="{ unlocked: localStorage.getItem('site_gate') === 'prospeccao', password: '', error: false, submit() { if (this.password === 'prospeccao') { localStorage.setItem('site_gate', 'prospeccao'); this.unlocked = true; } else { this.error = true; } } }" x-show="!unlocked" x-cloak class="fixed inset-0 z-[200] flex items-center justify-center bg-primary" style="display: none;">
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 20% 50%, #fff 0%, transparent 50%), radial-gradient(circle at 80% 80%, #fff 0%, transparent 40%);"></div>
<div class="relative w-full max-w-sm mx-4">
<div class="text-center mb-8">
<img src="/static/img/logo-symbol.png" alt="Prospecção Brasil" class="mx-auto mb-4" width="96" height="78">
<h1 class="font-display text-2xl text-on-primary font-bold">Prospecção Brasil</h1>
<p class="text-sm text-on-primary/50 mt-2 uppercase tracking-wider">Área Restrita</p>
</div>
<div class="bg-white rounded-2xl p-6 shadow-2xl">
<p class="text-sm text-slate-600 mb-4 text-center">Este site é exclusivo para clientes e parceiros autorizados. Informe a senha para acessar.</p>
<form @submit.prevent="submit()" class="space-y-4">
<div>
<input type="password" x-model="password" placeholder="Senha" @input="error = false" class="form-input text-center" autocomplete="off" :class="{ 'form-input-error': error }">
<p x-show="error" x-cloak class="form-error text-center mt-2" style="display: none;">Senha incorreta. Tente novamente.</p>
</div>
<button type="submit" class="btn btn-filled w-full">Acessar</button>
</form>
</div>
<p class="text-center text-xs text-on-primary/40 mt-6">Prospecção Brasil -- Retail & Real Estate</p>
</div>
</div>
{{end}}
