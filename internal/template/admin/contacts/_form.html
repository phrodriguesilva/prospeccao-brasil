{{define "contacts_form.html"}}
<form hx-post="{{if .Client}}/clients/{{uuidToString .Client.ID}}/contacts{{else if .Prospect}}/prospections/{{uuidToString .Prospect.ID}}/contacts{{end}}"
      hx-target="#contact-log"
      hx-swap="innerHTML"
      class="space-y-3">
<div class="grid grid-cols-2 gap-3">
<div>
<label class="form-label">Canal *</label>
<select name="channel" class="form-input" required>
<option value="phone">Telefone</option>
<option value="email">Email</option>
<option value="whatsapp">WhatsApp</option>
<option value="in_person">Presencial</option>
</select>
</div>
<div>
<label class="form-label">Direção *</label>
<select name="direction" class="form-input" required>
<option value="outbound">Realizado</option>
<option value="inbound">Recebido</option>
</select>
</div>
</div>
<div>
<label class="form-label">Assunto</label>
<input type="text" name="subject" class="form-input">
</div>
<div>
<label class="form-label">Mensagem</label>
<textarea name="body" class="form-input" rows="2"></textarea>
</div>
<button type="submit" class="btn btn-filled btn-sm">Registrar Contato</button>
</form>
{{end}}
