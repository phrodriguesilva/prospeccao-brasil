{{define "login.html"}}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login -- Prospecção Brasil</title>
{{template "brand_icons" .}}
<link rel="stylesheet" href="/static/css/phosphor.css"><link rel="stylesheet" href="/static/css/app.css?v=20260804c">
<script src="/static/js/htmx.min.js" defer></script>
<script src="/static/js/alpine.min.js" defer></script>
</head>
<body class="font-sans min-h-screen flex bg-surface text-on-surface">
<div class="hidden lg:flex lg:w-1/2 bg-surface-container flex-col justify-center items-center p-12 relative overflow-hidden">
<div class="diag-lines"></div>
<div class="dot-matrix"></div>
<div class="relative z-10 text-center">
<img src="/static/img/logo-full.png" alt="Prospecção Brasil -- Retail & Real Estate" class="logo-auth-full mx-auto footer-logo-full" width="280" height="204">
<p class="text-sm text-gold-brand mt-8 uppercase tracking-widest">Sistema Interno</p>
</div>
</div>
<div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 bg-surface">
<div class="w-full max-w-sm">
<div class="lg:hidden text-center mb-8">
<img src="/static/img/logo-symbol.png" alt="Prospecção Brasil" class="logo-auth mx-auto mb-3 nav-logo-symbol" width="112" height="90">
<p class="text-sm text-gold-brand uppercase tracking-widest">Sistema Interno</p>
</div>
<h2 class="font-display text-2xl text-white mb-2">Bem-vindo de volta</h2>
<p class="text-sm text-on-surface-variant mb-8">Faça login para acessar o sistema.</p>
{{if .Error}}<div class="alert alert-error mb-4">{{.Error}}</div>{{end}}
<form method="POST" action="/login" class="space-y-5">
<div>
<label for="email" class="form-label">Email</label>
<input type="email" id="email" name="email" required class="form-input" placeholder="seu@email.com" autocomplete="email">
</div>
<div>
<label for="password" class="form-label">Senha</label>
<input type="password" id="password" name="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
</div>
<button type="submit" class="btn btn-filled w-full">Entrar</button>
</form>
</div>
</div>
</body>
</html>{{end}}
