{{define "login.html"}}<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login -- Prospecção Brasil</title>
{{template "brand_icons" .}}
<link rel="stylesheet" href="/static/css/app.css">
<script src="/static/js/htmx.min.js" defer></script>
<script src="/static/js/alpine.min.js" defer></script>
</head>
<body class="font-sans min-h-screen flex bg-slate-50">
<div class="hidden lg:flex lg:w-1/2 bg-primary text-on-primary flex-col justify-center items-center p-12 relative overflow-hidden">
<div class="relative z-10 text-center">
<img src="/static/img/logo-full.png" alt="Prospecção Brasil -- Retail & Real Estate" class="logo-auth-full mx-auto" width="280" height="204">
<p class="text-sm text-on-primary/50 mt-8">Sistema Interno</p>
</div>
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 20% 50%, #fff 0%, transparent 50%), radial-gradient(circle at 80% 80%, #fff 0%, transparent 40%);"></div>
</div>
<div class="w-full lg:w-1/2 flex items-center justify-center px-6 py-12 bg-white lg:bg-slate-50">
<div class="w-full max-w-sm">
<div class="lg:hidden text-center mb-8">
<img src="/static/img/logo-symbol.png" alt="Prospecção Brasil" class="logo-auth mx-auto mb-3" width="112" height="90">
<p class="text-sm text-slate-500">Sistema Interno</p>
</div>
<h2 class="font-display text-2xl text-slate-900 mb-2">Bem-vindo de volta</h2>
<p class="text-sm text-slate-500 mb-8">Faça login para acessar o sistema.</p>
{{if .Error}}<div class="alert alert-error mb-4">{{.Error}}</div>{{end}}
<form method="POST" action="/login" class="space-y-5">
<div>
<label for="email" class="form-label">Email</label>
<input type="email" id="email" name="email" required class="form-input" placeholder="seu@email.com" autocomplete="email">
</div>
<div>
<label for="password" class="form-label">Senha</label>
<input type="password" id="password" name="password" required class="form-input" placeholder="••••••••" autocomplete="current-password">
</div>
<button type="submit" class="btn btn-filled w-full">Entrar</button>
</form>
</div>
</div>
</body>
</html>{{end}}
