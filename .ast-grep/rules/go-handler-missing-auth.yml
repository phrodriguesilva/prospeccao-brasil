id: go-handler-missing-auth
language: go
rule:
  pattern: |
    func $NAME(w http.ResponseWriter, r *http.Request) {
      $$$BODY
    }
  not:
    any:
      - has:
          pattern: |
            r.Context().Value("user")
      - has:
          pattern: |
            r.Context().Value("role")
      - has:
          pattern: |
            r.Context().Value(auth.CtxUser)
      - has:
          pattern: |
            r.Context().Value(auth.CtxRole)
      - has:
          pattern: |
            auth.RoleFromContext
      - has:
          pattern: |
            auth.TenantIDFromContext
      - has:
          pattern: |
            SessionIDFromContext
      - has:
          pattern: |
            redirectToLogin
constraints:
  NAME:
    not:
      regex: (?i)(health|ready|live|ping|login|logout|totp|2fa|admin)
message: "HTTP handler without auth context access. Every handler must be auth-gated or explicitly excluded."
severity: error
